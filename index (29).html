<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Такси-ночь 3D</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<canvas id="c"></canvas>

<div id="hud" hidden>
  <div class="box"><span id="earned">0</span> ₸ за смену</div>
  <div class="box" id="lives"></div>
  <div class="box" id="fare">Ищем пассажира</div>
  <div class="box"><span id="spd">0</span> км/ч</div>
</div>
<div id="msg"></div>

<div id="touch" hidden>
  <button id="bl" aria-label="Влево">◀</button>
  <button id="br" aria-label="Вправо">▶</button>
</div>

<div id="overlay">
  <div class="panel">
    <h1>Такси-ночь</h1>
    <p id="sub">Подбирай зелёные метки, довози пассажиров до жёлтых. Не врезайся в машины.</p>
    <p id="result"></p>
    <p class="wallet">В кошельке: <b id="money">0</b> ₸</p>
    <div class="shop">
      <button id="buyTurbo"></button>
      <button id="buyHp"></button>
    </div>
    <button id="start" class="go">Выехать на смену</button>
    <p class="hint">Управление: ← → или A / D, на телефоне — кнопки или свайп</p>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="script.js"></script>
</body>
</html>
